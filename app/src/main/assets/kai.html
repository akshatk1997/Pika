<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Kai AI</title>
<style>
  /* Premium Typography (Söhne & Söhne Mono) */
  @font-face {
    font-family: 'Söhne';
    src: local('Söhne'), local('Sohne'), local('Inter'), local('Segoe UI'), local('-apple-system'), local('Roboto');
    font-weight: 400;
  }
  @font-face {
    font-family: 'Söhne';
    src: local('Söhne'), local('Sohne'), local('Inter Medium'), local('Segoe UI Semibold'), local('Roboto Medium');
    font-weight: 500;
  }
  @font-face {
    font-family: 'Söhne';
    src: local('Söhne'), local('Sohne'), local('Inter Bold'), local('Segoe UI Bold'), local('Roboto Bold');
    font-weight: 600;
  }
  @font-face {
    font-family: 'Söhne Mono';
    src: local('Söhne Mono'), local('Sohne Mono'), local('SFMono-Regular'), local('Menlo'), local('Consolas'), local('Roboto Mono');
  }

  /* Original Signature Cosmic Dark Background & Palette */
  :root, [data-theme="dark"] {
    --bg: #070B14;
    --surface: #0E1626;
    --surface-hover: #152238;
    --surface-variant: #111B2E;
    --border: #1E2D4A;
    --border-subtle: rgba(255, 255, 255, 0.08);
    --accent: #00F2FE;
    --accent-subtle: rgba(0, 242, 254, 0.15);
    --accent-glow: rgba(0, 242, 254, 0.35);
    --indigo: #6366F1;
    --text: #F1F5F9;
    --text-muted: #94A3B8;
    --bubble-user: #13233D;
    --bubble-ai: #0B1322;
    --code-bg: #050810;
    --code-header: #0E1626;
    --danger: #EF4444;
    --success: #10B981;
    --font-sans: 'Söhne', 'Sohne', ui-sans-serif, -apple-system, 'Inter', 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    --font-mono: 'Söhne Mono', 'Sohne Mono', ui-monospace, SFMono-Regular, Consolas, 'Roboto Mono', monospace;
    color-scheme: dark;
  }
  .logo-core {
    fill: #FFFFFF;
  }

  /* Pristine Modern Light Mode Palette */
  [data-theme="light"] {
    --bg: #F8FAFC;
    --surface: #FFFFFF;
    --surface-hover: #F1F5F9;
    --surface-variant: #F1F5F9;
    --border: #E2E8F0;
    --border-subtle: rgba(0, 0, 0, 0.06);
    --accent: #0284C7;
    --accent-subtle: rgba(2, 132, 199, 0.12);
    --accent-glow: rgba(2, 132, 199, 0.25);
    --indigo: #4F46E5;
    --text: #0F172A;
    --text-muted: #64748B;
    --bubble-user: #E0F2FE;
    --bubble-ai: #FFFFFF;
    --code-bg: #F8FAFC;
    --code-header: #E2E8F0;
    --danger: #DC2626;
    --success: #059669;
    color-scheme: light;
  }

  [data-theme="light"] header {
    background: rgba(255, 255, 255, 0.95);
    border-bottom: 1px solid var(--border);
  }
  [data-theme="light"] .brand-title {
    background: linear-gradient(135deg, #0F172A 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  [data-theme="light"] footer {
    background: rgba(255, 255, 255, 0.97);
    border-top: 1px solid var(--border);
  }
  [data-theme="light"] .empty-title {
    color: #0F172A;
  }
  [data-theme="light"] .empty-subtitle {
    color: #475569;
  }
  [data-theme="light"] .logo-core {
    fill: #0F172A;
  }
  [data-theme="light"] .input-wrapper {
    background: #F1F5F9;
    border-color: #CBD5E1;
  }
  [data-theme="light"] .input-wrapper:focus-within {
    border-color: var(--accent);
    background: #FFFFFF;
    box-shadow: 0 0 0 2px var(--accent-subtle);
  }
  [data-theme="light"] #prompt-input {
    color: #0F172A;
  }
  [data-theme="light"] #prompt-input::placeholder {
    color: #64748B;
  }
  [data-theme="light"] .send-btn {
    background: var(--accent);
    color: #FFFFFF;
  }
  [data-theme="light"] .send-btn svg {
    fill: #FFFFFF;
  }
  [data-theme="light"] .msg-bubble {
    color: #0F172A;
  }
  [data-theme="light"] .msg-row.ai .msg-bubble {
    background: #FFFFFF;
    border-color: #E2E8F0;
    color: #0F172A;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.05);
  }
  [data-theme="light"] .ai-content h1,
  [data-theme="light"] .ai-content h2,
  [data-theme="light"] .ai-content h3 {
    color: #0F172A;
  }
  [data-theme="light"] .ai-content strong {
    color: #0F172A;
  }
  [data-theme="light"] .ai-content p,
  [data-theme="light"] .ai-content li {
    color: #1E293B;
  }
  [data-theme="light"] .msg-row.user .msg-bubble {
    background: #E0F2FE;
    border-color: rgba(2, 132, 199, 0.35);
    color: #0C4A6E;
  }
  [data-theme="light"] .msg-row.user .msg-bubble strong {
    color: #082F49;
  }
  [data-theme="light"] .suggestion-pill {
    background: #FFFFFF;
    border-color: #CBD5E1;
    color: #1E293B;
    box-shadow: 0 1px 2px rgba(0,0,0,0.04);
  }
  [data-theme="light"] .suggestion-pill:hover {
    background: #F8FAFC;
    border-color: var(--accent);
    color: var(--accent);
  }
  [data-theme="light"] pre {
    background: #F8FAFC;
    border-color: #E2E8F0;
    color: #0F172A;
  }
  [data-theme="light"] pre code {
    color: #0F172A;
  }
  [data-theme="light"] code {
    background: #F1F5F9;
    border: 1px solid #E2E8F0;
    color: #0284C7;
  }
  [data-theme="light"] .code-header {
    background: #EDF2F7;
    border-bottom: 1px solid #E2E8F0;
    color: #475569;
  }
  [data-theme="light"] .code-header button {
    background: #FFFFFF;
    border-color: #CBD5E1;
    color: #475569;
  }
  [data-theme="light"] .code-header button:hover {
    background: #F8FAFC;
    color: #0F172A;
  }
  [data-theme="light"] .thought-process {
    background: rgba(79, 70, 229, 0.05);
    border: 1px solid rgba(79, 70, 229, 0.22);
    border-radius: 12px;
  }
  [data-theme="light"] .thought-process summary {
    color: #4338CA;
    font-weight: 600;
  }
  [data-theme="light"] .thought-process .reasoning-text {
    color: #334155;
    border-top: 1px dashed rgba(79, 70, 229, 0.2);
  }
  [data-theme="light"] .persona-btn {
    background: #F1F5F9;
    border-color: #CBD5E1;
    color: #475569;
  }
  [data-theme="light"] .persona-btn:hover {
    background: #E2E8F0;
    color: #0F172A;
  }
  [data-theme="light"] .persona-btn.active {
    background: rgba(2, 132, 199, 0.12);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 8px rgba(2, 132, 199, 0.2);
  }
  [data-theme="light"] .new-chat-btn {
    background: #F1F5F9;
    border-color: #CBD5E1;
    color: #475569;
  }
  [data-theme="light"] .new-chat-btn:active {
    background: #E2E8F0;
    color: #0F172A;
    border-color: var(--accent);
  }
  [data-theme="light"] .theme-toggle-btn {
    background: #F1F5F9;
    border-color: #CBD5E1;
    color: #475569;
  }
  [data-theme="light"] .theme-toggle-btn:hover {
    border-color: var(--accent);
    color: #0F172A;
  }
  [data-theme="light"] .action-pill-btn {
    background: #F1F5F9;
    border-color: #CBD5E1;
    color: #475569;
  }
  [data-theme="light"] .action-pill-btn:hover, [data-theme="light"] .action-pill-btn:active {
    background: #E2E8F0;
    color: #0F172A;
  }
  [data-theme="light"] .msg-doc-chip {
    background: #F1F5F9;
    border-color: #E2E8F0;
    color: #334155;
  }

  * {
    box-sizing: border-box;
    margin: 0;
    padding: 0;
    -webkit-tap-highlight-color: transparent;
  }

  html, body {
    width: 100%;
    height: 100%;
    background-color: var(--bg);
    color: var(--text);
    font-family: var(--font-sans);
    font-size: 15px;
    line-height: 1.65;
    letter-spacing: -0.012em;
    overflow: hidden;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
  }

  header {
    background: rgba(14, 22, 38, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--border);
    padding: 10px 14px 8px;
    display: flex;
    flex-direction: column;
    gap: 8px;
    flex-shrink: 0;
    z-index: 10;
  }

  .header-top {
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .brand {
    display: flex;
    align-items: center;
    gap: 9px;
  }

  .brand svg {
    width: 26px;
    height: 26px;
  }

  .brand-title {
    font-weight: 700;
    font-size: 1.1rem;
    letter-spacing: -0.02em;
    background: linear-gradient(135deg, #FFFFFF 30%, var(--accent) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    font-family: var(--font-sans);
  }

  .header-actions {
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .theme-toggle-btn {
    background: var(--surface-variant);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.8rem;
    padding: 6px 10px;
    border-radius: 18px;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .theme-toggle-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }
  [data-theme="light"] .theme-toggle-btn .sun-icon {
    display: none;
  }
  [data-theme="light"] .theme-toggle-btn .moon-icon {
    display: block;
    color: #0F172A;
  }
  [data-theme="dark"] .theme-toggle-btn .sun-icon {
    display: block;
    color: #FCD34D;
  }
  [data-theme="dark"] .theme-toggle-btn .moon-icon {
    display: none;
  }
  :root:not([data-theme]) .theme-toggle-btn .sun-icon {
    display: block;
    color: #FCD34D;
  }
  :root:not([data-theme]) .theme-toggle-btn .moon-icon {
    display: none;
  }

  .new-chat-btn {
    background: var(--surface-variant);
    border: 1px solid var(--border);
    color: var(--text-muted);
    padding: 5px 12px;
    border-radius: 18px;
    font-size: 0.8rem;
    font-weight: 500;
    font-family: var(--font-sans);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    transition: all 0.2s ease;
  }
  .new-chat-btn:active {
    background: var(--surface-hover);
    color: var(--text);
    border-color: var(--accent);
    transform: scale(0.96);
  }

  .personas {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding-bottom: 2px;
    scrollbar-width: none;
  }
  .personas::-webkit-scrollbar { display: none; }

  .persona-btn {
    background: var(--surface-variant);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.74rem;
    font-weight: 500;
    font-family: var(--font-sans);
    padding: 4px 10px;
    border-radius: 16px;
    white-space: nowrap;
    cursor: pointer;
    transition: all 0.2s ease;
  }
  .persona-btn.active {
    background: var(--accent-subtle);
    border-color: var(--accent);
    color: var(--accent);
    box-shadow: 0 0 10px var(--accent-glow);
  }

  main {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px 20px;
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }

  .empty-state {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 24px 14px;
    gap: 14px;
    max-width: 480px;
    margin: 0 auto;
  }

  .empty-logo {
    width: 60px;
    height: 60px;
    filter: drop-shadow(0 0 16px var(--accent-glow));
    animation: gentlePulse 3s infinite ease-in-out;
  }
  @keyframes gentlePulse {
    0%, 100% { transform: scale(1); opacity: 0.95; }
    50% { transform: scale(1.05); opacity: 1; }
  }

  .empty-title {
    font-size: 1.35rem;
    font-weight: 700;
    letter-spacing: -0.025em;
    color: #FFFFFF;
    font-family: var(--font-sans);
  }

  .empty-subtitle {
    font-size: 0.88rem;
    color: var(--text-muted);
    line-height: 1.55;
    font-family: var(--font-sans);
  }

  .suggestions {
    display: flex;
    flex-direction: column;
    gap: 8px;
    width: 100%;
    margin-top: 8px;
  }

  .suggestion-pill {
    background: var(--surface);
    border: 1px solid var(--border);
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.84rem;
    color: var(--text);
    text-align: left;
    cursor: pointer;
    transition: all 0.2s ease;
    font-family: var(--font-sans);
  }
  .suggestion-pill:hover, .suggestion-pill:active {
    background: var(--surface-hover);
    border-color: var(--accent);
    color: var(--accent);
    transform: translateY(-1px);
  }

  .msg-row {
    display: flex;
    flex-direction: column;
    gap: 6px;
    max-width: 90%;
    animation: fadeIn 0.25s ease-out;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(6px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .msg-row.user {
    align-self: flex-end;
  }
  .msg-row.ai {
    align-self: flex-start;
    max-width: 96%;
  }

  .msg-bubble {
    padding: 12px 15px;
    border-radius: 18px;
    word-break: break-word;
    font-size: 0.95rem;
    line-height: 1.6;
    font-family: var(--font-sans);
  }

  .msg-row.user .msg-bubble {
    background: var(--bubble-user);
    border: 1px solid rgba(0, 242, 254, 0.25);
    color: #FFFFFF;
    border-bottom-right-radius: 4px;
  }

  .msg-row.ai .msg-bubble {
    background: var(--bubble-ai);
    border: 1px solid var(--border);
    color: var(--text);
    border-bottom-left-radius: 4px;
    width: 100%;
  }

  .ai-meta {
    display: flex;
    align-items: center;
    gap: 6px;
    font-size: 0.72rem;
    color: var(--text-muted);
    padding-left: 4px;
    font-family: var(--font-sans);
  }
  .ai-meta .dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    box-shadow: 0 0 6px var(--accent-glow);
  }

  /* Thought Process Collapsible */
  .thought-process {
    background: rgba(99, 102, 241, 0.08);
    border: 1px solid rgba(99, 102, 241, 0.25);
    border-radius: 12px;
    padding: 8px 12px;
    margin-bottom: 12px;
    font-size: 0.84rem;
    font-family: var(--font-sans);
  }
  .thought-process summary {
    cursor: pointer;
    font-weight: 500;
    color: #818CF8;
    user-select: none;
    outline: none;
  }
  .thought-process .reasoning-text {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px dashed rgba(99, 102, 241, 0.2);
    color: var(--text-muted);
    line-height: 1.55;
  }

  .ai-content h1, .ai-content h2, .ai-content h3 {
    margin: 12px 0 6px;
    font-weight: 600;
    color: #FFFFFF;
    letter-spacing: -0.015em;
    font-family: var(--font-sans);
  }
  .ai-content h1 { font-size: 1.25rem; }
  .ai-content h2 { font-size: 1.12rem; }
  .ai-content h3 { font-size: 1.02rem; }
  .ai-content p {
    margin-bottom: 8px;
  }
  .ai-content ul, .ai-content ol {
    margin: 6px 0 10px 20px;
  }
  .ai-content li {
    margin-bottom: 4px;
  }

  /* Premium Code Block Styling with Header Bar & Copy Button */
  .code-block-wrapper {
    margin: 10px 0;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid var(--border);
    background: var(--code-bg);
  }
  .code-header {
    background: var(--code-header);
    padding: 6px 12px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 0.72rem;
    font-family: var(--font-sans);
    color: var(--text-muted);
    border-bottom: 1px solid var(--border);
    text-transform: uppercase;
    letter-spacing: 0.05em;
  }
  .copy-code-btn {
    background: transparent;
    border: none;
    color: var(--text-muted);
    font-size: 0.72rem;
    font-family: var(--font-sans);
    cursor: pointer;
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 2px 6px;
    border-radius: 4px;
    transition: all 0.15s ease;
  }
  .copy-code-btn:hover {
    color: var(--text);
    background: rgba(255, 255, 255, 0.08);
  }
  pre {
    margin: 0;
    padding: 12px;
    overflow-x: auto;
    font-family: var(--font-mono);
    font-size: 0.85rem;
    line-height: 1.5;
    background: var(--code-bg);
    color: #E2E8F0;
  }
  code {
    font-family: var(--font-mono);
    font-size: 0.85em;
    background: rgba(255, 255, 255, 0.08);
    padding: 2px 5px;
    border-radius: 4px;
    color: var(--accent);
  }

  .ai-actions {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    padding-left: 2px;
  }
  .action-pill-btn {
    background: var(--surface-variant);
    border: 1px solid var(--border);
    color: var(--text-muted);
    font-size: 0.72rem;
    font-family: var(--font-sans);
    padding: 4px 9px;
    border-radius: 12px;
    cursor: pointer;
    transition: all 0.15s ease;
  }
  .action-pill-btn:hover {
    color: var(--text);
    border-color: var(--accent);
  }

  /* Typing indicator dots */
  .typing-indicator {
    display: flex;
    align-items: center;
    gap: 4px;
    padding: 4px 6px;
  }
  .typing-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent);
    animation: typingBounce 1.4s infinite ease-in-out both;
  }
  .typing-dot:nth-child(1) { animation-delay: -0.32s; }
  .typing-dot:nth-child(2) { animation-delay: -0.16s; }
  @keyframes typingBounce {
    0%, 80%, 100% { transform: scale(0); opacity: 0.4; }
    40% { transform: scale(1); opacity: 1; }
  }

  .error-card {
    background: rgba(239, 68, 68, 0.1);
    border: 1px solid rgba(239, 68, 68, 0.3);
    color: #F87171;
    padding: 10px 14px;
    border-radius: 12px;
    font-size: 0.86rem;
    font-family: var(--font-sans);
    display: flex;
    flex-direction: column;
    gap: 8px;
  }
  .retry-btn {
    align-self: flex-start;
    background: rgba(239, 68, 68, 0.15);
    border: 1px solid rgba(239, 68, 68, 0.35);
    color: #FCA5A5;
    font-size: 0.74rem;
    font-weight: 600;
    font-family: var(--font-sans);
    padding: 5px 12px;
    border-radius: 8px;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 4px;
    transition: all 0.15s ease;
  }
  .retry-btn:active {
    background: rgba(239, 68, 68, 0.3);
  }

  /* Footer and Clean Input */
  footer {
    background: rgba(14, 22, 38, 0.94);
    backdrop-filter: blur(14px);
    -webkit-backdrop-filter: blur(14px);
    border-top: 1px solid var(--border);
    padding: 10px 14px 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
    flex-shrink: 0;
  }

  .footer-row {
    display: flex;
    align-items: flex-end;
    gap: 8px;
  }

  .input-wrapper {
    flex: 1;
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 24px;
    padding: 10px 16px;
    display: flex;
    align-items: center;
    transition: border-color 0.2s ease;
  }
  .input-wrapper:focus-within {
    border-color: var(--accent);
  }
  #prompt-input {
    width: 100%;
    background: transparent;
    border: none;
    outline: none;
    color: var(--text);
    font-size: 0.95rem;
    font-family: var(--font-sans);
    resize: none;
    max-height: 120px;
    line-height: 1.45;
  }
  #prompt-input::placeholder {
    color: var(--text-muted);
  }

  .send-btn {
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--accent);
    color: #070B14;
    border: none;

  // Pure JavaScript in-memory streaming text extractor for PDF documents
  async function extractPdfText(buffer) {
    try {
      const bytes = new Uint8Array(buffer);
      let str = '';
      const len = Math.min(bytes.length, 1024 * 1024 * 2);
      const chunkSize = 8192;
      for (let i = 0; i < len; i += chunkSize) {
        const slice = bytes.subarray(i, Math.min(i + chunkSize, len));
        str += String.fromCharCode.apply(null, slice);
      }

      function unescapePdfString(s) {
        return s
          .replace(/\\([0-7]{1,3})/g, (_, oct) => String.fromCharCode(parseInt(oct, 8)))
          .replace(/\\n/g, '\n')
          .replace(/\\r/g, '\r')
          .replace(/\\t/g, '\t')
          .replace(/\\b/g, '\b')
          .replace(/\\f/g, '\f')
          .replace(/\\\(/g, '(')
          .replace(/\\\)/g, ')')
          .replace(/\\\\/g, '\\');
      }

      function parseTextFromPdfString(content) {
        const pieces = [];
        const tjRegex = /\(([\s\S]*?)\)\s*Tj/g;
        let match;
        while ((match = tjRegex.exec(content)) !== null) {
          const unescaped = unescapePdfString(match[1]);
          if (unescaped.trim()) pieces.push(unescaped.trim());
          if (pieces.length > 500) break;
        }

        const tjArrayRegex = /\[([\s\S]*?)\]\s*TJ/g;
        while ((match = tjArrayRegex.exec(content)) !== null) {
          const inner = match[1];
          const innerStrRegex = /\(([\s\S]*?)\)/g;
          let innerMatch;
          let line = '';
          while ((innerMatch = innerStrRegex.exec(inner)) !== null) {
            line += unescapePdfString(innerMatch[1]);
          }
          if (line.trim()) pieces.push(line.trim());
          if (pieces.length > 800) break;
        }

        if (pieces.length === 0) {
          const btRegex = /BT[\s\S]*?ET/g;
          while ((match = btRegex.exec(content)) !== null) {
            const block = match[0];
            const sRegex = /\(([\s\S]*?)\)/g;
            let sMatch;
            let blockText = '';
            while ((sMatch = sRegex.exec(block)) !== null) {
              blockText += ' ' + unescapePdfString(sMatch[1]);
            }
            if (blockText.trim()) pieces.push(blockText.trim());
            if (pieces.length > 800) break;
          }
        }
        return pieces;
      }

      let allTextPieces = parseTextFromPdfString(str);

      // Check compressed Flate streams if raw search found no text
      if (allTextPieces.length === 0 && typeof DecompressionStream !== 'undefined') {
        const streamStartToken = 'stream';
        const streamEndToken = 'endstream';
        let searchIdx = 0;
        while (searchIdx < str.length && allTextPieces.length < 500) {
          const startPos = str.indexOf(streamStartToken, searchIdx);
          if (startPos === -1) break;
          let dataStart = startPos + streamStartToken.length;
          while (dataStart < str.length && (bytes[dataStart] === 10 || bytes[dataStart] === 13 || bytes[dataStart] === 32)) {
            dataStart++;
          }

          const endPos = str.indexOf(streamEndToken, dataStart);
          if (endPos === -1) break;

          let dataEnd = endPos;
          while (dataEnd > dataStart && (bytes[dataEnd - 1] === 10 || bytes[dataEnd - 1] === 13 || bytes[dataEnd - 1] === 32)) {
            dataEnd--;
          }

          const streamBytes = bytes.subarray(dataStart, dataEnd);
          if (streamBytes.length > 10) {
            try {
              const ds = new DecompressionStream('deflate');
              const writer = ds.writable.getWriter();
              writer.write(streamBytes);
              writer.close();
              const decompressedText = await new Response(ds.readable).text();
              const decompressedPieces = parseTextFromPdfString(decompressedText);
              if (decompressedPieces.length > 0) {
                allTextPieces.push(...decompressedPieces);
              }
            } catch (_) {
              try {
                const dsRaw = new DecompressionStream('deflate-raw');
                const writerRaw = dsRaw.writable.getWriter();
                writerRaw.write(streamBytes);
                writerRaw.close();
                const decompressedTextRaw = await new Response(dsRaw.readable).text();
                const decompPieces = parseTextFromPdfString(decompressedTextRaw);
                if (decompPieces.length > 0) {
                  allTextPieces.push(...decompPieces);
                }
              } catch (_) {}
            }
          }
          searchIdx = endPos + streamEndToken.length;
        }
      }

      return allTextPieces.join('\n').substring(0, 32000);
    } catch (_) {
      return '';
    }
  }

              width: w,

              isCandy: isCandy,
              isDocument: isDocument,

    });

  // Pure JavaScript in-memory Video Keyframe Extraction Engine
  function extractVideoKeyframes(file) {
    return new Promise((resolve) => {
      try {
        const url = URL.createObjectURL(file);
        const video = document.createElement('video');
        video.muted = true;
        video.playsInline = true;
        video.preload = 'metadata';
        video.src = url;

        let finished = false;
        const finish = (result) => {
          if (!finished) {
            finished = true;
            URL.revokeObjectURL(url);
            resolve(result);
          }
        };

        // 4s safety watchdog
        setTimeout(() => {
          finish({
            duration: 0,
            width: 0,
            height: 0,
            keyframeDataUrl: null
          });
        }, 4000);

        video.onloadedmetadata = () => {
          const duration = video.duration || 0;
          const seekTime = duration > 1 ? Math.min(1.0, duration / 2) : 0.1;
          video.currentTime = seekTime;
        };

        video.onseeked = () => {
          try {
            const width = video.videoWidth || 480;
            const height = video.videoHeight || 270;
            const canvas = document.createElement('canvas');
            const maxDim = 480;
            let cw = width, ch = height;
            if (cw > maxDim || ch > maxDim) {
              if (cw > ch) {
                ch = Math.round((ch * maxDim) / cw);
                cw = maxDim;
              } else {
                cw = Math.round((cw * maxDim) / ch);
                ch = maxDim;
              }
            }
            canvas.width = cw;
            canvas.height = ch;
            const ctx = canvas.getContext('2d');
            ctx.drawImage(video, 0, 0, cw, ch);
            const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
            finish({
              duration: Math.round(video.duration || 0),
              width: width,
              height: height,
              keyframeDataUrl: dataUrl
            });
          } catch (_) {
            finish({
              duration: Math.round(video.duration || 0),
              width: video.videoWidth || 0,
              height: video.videoHeight || 0,
              keyframeDataUrl: null
            });
          }
        };

        video.onerror = () => {
          finish({
            duration: 0,
            width: 0,
            height: 0,
            keyframeDataUrl: null
          });
        };
      } catch (_) {
        resolve({ duration: 0, width: 0, height: 0, keyframeDataUrl: null });
      }
    });
  }

  async function handleFileSelect(e) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;

    const isPdf = file.type === 'application/pdf' || file.name.toLowerCase().endsWith('.pdf');
    const isImage = file.type.startsWith('image/');
    const isVideo = file.type.startsWith('video/') || /\.(mp4|webm|mkv|mov|avi|3gp)$/i.test(file.name);

    if (!isPdf && !isImage && !isVideo) {
      alert('Please attach an image, video, or PDF document.');
      clearAttachment();
      return;
    }

    if (isImage) {
      const reader = new FileReader();
      reader.onload = function(evt) {
        const dataUrl = evt.target.result;
        currentAttachment = {
          type: 'image',
          name: file.name,
          size: file.size,
          dataUrl: dataUrl,
          visualAnalysis: null
        };
        analyzeImageVisuals(dataUrl, file.name).then(analysis => {
          if (currentAttachment && currentAttachment.dataUrl === dataUrl) {
            currentAttachment.visualAnalysis = analysis;

        }).catch(() => {});
        if (attachPreviewImg) {
          attachPreviewImg.src = dataUrl;

        if (attachVideoIcon) attachVideoIcon.style.display = 'none';

        if (attachSize) attachSize.textContent = formatFileSize(file.size);
        if (attachTray) attachTray.style.display = 'flex';
      };
      reader.readAsDataURL(file);
    } else if (isVideo) {
      // Temporarily display tray with video icon while keyframe extracts
      currentAttachment = {
        type: 'video',
        name: file.name,
        size: file.size,
        duration: 0,
        width: 0,
        height: 0,
        dataUrl: null
      };
      if (attachPreviewImg) attachPreviewImg.style.display = 'none';
      if (attachDocIcon) attachDocIcon.style.display = 'none';
      if (attachVideoIcon) attachVideoIcon.style.display = 'flex';

      const keyframeInfo = await extractVideoKeyframes(file);
      currentAttachment.duration = keyframeInfo.duration;
      currentAttachment.width = keyframeInfo.width;
      currentAttachment.height = keyframeInfo.height;
      currentAttachment.dataUrl = keyframeInfo.keyframeDataUrl;

      if (keyframeInfo.keyframeDataUrl && attachPreviewImg) {
        attachPreviewImg.src = keyframeInfo.keyframeDataUrl;
        attachPreviewImg.style.display = 'block';
        if (attachVideoIcon) attachVideoIcon.style.display = 'none';

      let metaStr = formatFileSize(file.size);

      if (keyframeInfo.width > 0) metaStr += ' • ' + keyframeInfo.width + 'x' + keyframeInfo.height;
      if (attachSize) attachSize.textContent = metaStr;

    } else if (isPdf) {
      const reader = new FileReader();
      reader.onload = async function(evt) {

        try {

        if (attachSize) attachSize.textContent = formatFileSize(file.size);
        if (attachTray) attachTray.style.display = 'flex';

      reader.readAsArrayBuffer(file);
    }

  // Markdown & Code Renderer
  function formatMarkdown(text) {
    if (!text) return '';
    let out = escapeHtml(text);
    // Code blocks with header bar
    out = out.replace(/\`\`\`([a-zA-Z0-9_-]*)\n([\s\S]*?)\`\`\`/g, function(match, lang, code) {
      const language = lang || 'code';
      return '<div class="code-block-wrapper">' +
               '<div class="code-header">' +
                 '<span>' + language + '</span>' +
                 '<button class="copy-code-btn" onclick="copySnippet(this)">' +
                   '<svg viewBox="0 0 24 24" width="13" height="13" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg> Copy code' +
                 '</button>' +
               '</div>' +
               '<pre><code>' + code + '</code></pre>' +
             '</div>';
    });
    // Inline code
    out = out.replace(/\`([^\`]+)\`/g, function(m, p) { return '<code>' + p + '</code>'; });
    // Headings
    out = out.replace(/^### (.*$)/gim, '<h3>$1</h3>');
    out = out.replace(/^## (.*$)/gim, '<h2>$1</h2>');
    out = out.replace(/^# (.*$)/gim, '<h1>$1</h1>');
    // Bold
    out = out.replace(/\*\*([^*]+)\*\*/g, function(m, p) { return '<strong>' + p + '</strong>'; });
    // Italic
    out = out.replace(/\*([^*]+)\*/g, function(m, p) { return '<em>' + p + '</em>'; });
    // Bullet points
    out = out.replace(/^\s*[-*]\s+(.*)/gm, function(m, p) { return '&bull; ' + p + '<br>'; });
    // Numbered lists
    out = out.replace(/^\s*(\d+)\.\s+(.*)/gm, function(m, num, p) { return num + '. ' + p + '<br>'; });
    // Line breaks
    out = out.replace(/\n\n/g, '<br><br>');
    out = out.replace(/\n/g, '<br>');
    return out;
  }

  function extractSubjectEntity(query) {
    let raw = (query || '').trim();
    let cleaned = raw
      .replace(/^[\s#*_\-]+/, '')
      .replace(/^(can you\s+)?(please\s+)?(tell me\s+)?(what is|what's|who is|who's|where is|explain|describe|identify|how does|what are|define|meaning of)\s+(an?|the|this|that|these|those)?\s*/i, '')
      .replace(/\s*(mean|is this|is that|here)\??$/i, '')
      .replace(/[?!.]+$/, '')
      .trim();

    if (cleaned && !/^(this|that|it|something|thing|what)$/i.test(cleaned)) {
      return cleaned;
    }
    return '';
  }

      } else if (currentAttachment.type === 'video') {
        if (currentAttachment.dataUrl && attachPreviewImg) {
          attachPreviewImg.src = currentAttachment.dataUrl;
          attachPreviewImg.style.display = 'block';
          if (attachVideoIcon) attachVideoIcon.style.display = 'none';
        } else if (attachVideoIcon) {
          attachVideoIcon.style.display = 'flex';
          if (attachPreviewImg) attachPreviewImg.style.display = 'none';
        }
        if (attachDocIcon) attachDocIcon.style.display = 'none';
      } else if (currentAttachment.type === 'pdf') {
        if (attachPreviewImg) attachPreviewImg.style.display = 'none';
        if (attachVideoIcon) attachVideoIcon.style.display = 'none';
        if (attachDocIcon) attachDocIcon.style.display = 'flex';
      }
      if (attachName) attachName.textContent = currentAttachment.name;
      let metaStr = formatFileSize(currentAttachment.size);
      if (currentAttachment.duration) metaStr += ' • ' + formatVideoDuration(currentAttachment.duration);
      if (attachSize) attachSize.textContent = metaStr;
      if (attachTray) attachTray.style.display = 'flex';
    }
    handleSend();
  }

  async function handleSend() {
    const text = input.value.trim();
    const attachment = currentAttachment;

    if (!text && !attachment) return;
    if (isGenerating) return;

    // Cache state for 1-tap retry
    lastPromptState = { text: text, attachment: attachment };

    input.value = '';
    input.style.height = 'auto';

    clearAttachment();

    appendUserMessage(text, attachment);

    isGenerating = true;
    sendBtn.classList.add('stop');
    sendBtn.innerHTML = '<svg viewBox="0 0 24 24"><rect x="6" y="6" width="12" height="12" rx="2" fill="currentColor"/></svg>';
    sendBtn.title = 'Stop';

    const aiBubble = appendAiLoading();
    abortCtrl = new AbortController();

    // 12s safety watchdog
    watchdogTimer = setTimeout(() => {
      if (abortCtrl) abortCtrl.abort('timeout');
    }, 12000);

    try {
      let promptContent = text;
      if (attachment && attachment.type === 'pdf') {
        const docText = (attachment.extractedText || '').trim();
        if (docText) {
          promptContent = '[Attached PDF Document: ' + attachment.name + ']\n' +
            '--- Document Content Excerpt ---\n' +
            docText.substring(0, 16000) + '\n' +
            '--- End Document Content Excerpt ---\n\n' +
            (text ? 'User Question: ' + text : 'Please analyze and summarize the attached document, highlighting key points in natural language.');
        } else {
          promptContent = '[Attached PDF Document: ' + attachment.name + ' (' + formatFileSize(attachment.size) + ')]\n' +
            (text ? 'User Question: ' + text : 'Please review this attached PDF document in natural language.');
        }
      } else if (attachment && attachment.type === 'video') {
        promptContent = '[Attached Video File: ' + attachment.name + ' | Duration: ' + formatVideoDuration(attachment.duration) + ' | Resolution: ' + (attachment.width ? attachment.width + 'x' + attachment.height : 'Standard') + ' | Size: ' + formatFileSize(attachment.size) + ']\n' +
          (text ? 'User Question: ' + text : 'Please analyze this video file, describe what happens in the scene, the visual movement, objects, and explain the key elements in natural language.');
      }

      let userMsgContent;
      if (attachment && (attachment.type === 'image' || attachment.type === 'video') && attachment.dataUrl) {
        const promptLabel = attachment.type === 'video'
          ? (text ? text : 'Analyze this video keyframe and describe what is shown, visual scene, actions, subjects, and movement in pure human language.')
          : (text ? text : 'Analyze this image in detail. Identify what is shown, key features, colors, context, and provide a clear, accurate, pure human language description.');
        userMsgContent = [
          {
            type: 'text',
            text: promptLabel
          },
          {
            type: 'image_url',
            image_url: { url: attachment.dataUrl }
          }
        ];
      } else {
        userMsgContent = promptContent;
      }

      // Frontier Perplexity + Ollama Neural Inference Architecture (zero configuration)
      const textMessages = [
        { role: 'system', content: SYSTEM_PROMPT }
      ];
      chatHistory.forEach(item => {
        textMessages.push({ role: item.role, content: item.content });
      });
      textMessages.push({ role: 'user', content: userMsgContent });

      let responseText = '';
      let reasoningText = '';
      let generated = false;

      // 1. Instant deterministic Math evaluation in pure human language (0ms)
      if (!attachment && text) {
        const mathRes = checkMathQuery(text);
        if (mathRes) {
          responseText = mathRes.text;
          reasoningText = mathRes.reasoning;
          generated = true;
        }
      }

      // 2. Instant Conversational Greeting in pure human language (0ms)
      if (!generated && !attachment && text) {
        const greetRes = checkGreeting(text);
        if (greetRes) {
          responseText = greetRes.text;
          reasoningText = greetRes.reasoning;
          generated = true;
        }
      }

      // 3. Real-Time Perplexity Search & Source Synthesis (< 0.5s)
      if (!generated && !attachment && text) {
        const synth = await synthesizePerplexitySearch(text);
        if (synth && synth.text) {
          responseText = synth.text;
          reasoningText = synth.reasoning || 'Synthesized in real-time via Perplexity Search & Synthesis Engine.';
          generated = true;
        }
      }

      // 4. Ollama Open-Weights Neural Inference Pipeline (mistral / llama open models with zero configuration)
      if (!generated) {
        try {
          const pollAbort = new AbortController();
          const pollTimer = setTimeout(() => pollAbort.abort('timeout'), 5000);
          const pollResp = await fetch('https://text.pollinations.ai/openai/chat/completions', {
            method: 'POST',
            headers: {
              'Content-Type': 'application/json',
              'Authorization': 'Bearer ' + freeOpenSourceToken
            },
            body: JSON.stringify({
              model: 'mistral',
              messages: textMessages
            }),
            signal: pollAbort.signal
          });
          clearTimeout(pollTimer);
          if (pollResp.ok) {
            const pollJson = await pollResp.json();
            const choice = pollJson.choices && pollJson.choices[0];
            if (choice && choice.message && choice.message.content) {
              const resContent = choice.message.content.trim();
              if (!resContent.includes('reached its budget') && !resContent.includes('raise the key budget') && resContent.length > 0) {
                responseText = resContent;
                reasoningText = choice.message.reasoning || 'Processed through Ollama open neural intelligence in pure human language.';
                generated = true;
              }
            }
          }
        } catch (_) {}
      }

      // 4b. High-Speed Direct Ollama Stream Inference (Fast Stream Fallback with zero configuration)
      if (!generated && (!attachment || (attachment.type !== 'image' && attachment.type !== 'video'))) {
        try {
          const getAbort = new AbortController();
          const getTimer = setTimeout(() => getAbort.abort('timeout'), 4000);
          const getUrl = 'https://text.pollinations.ai/' + encodeURIComponent(promptContent) +
            '?model=mistral&system=' + encodeURIComponent(SYSTEM_PROMPT);
          const getResp = await fetch(getUrl, { signal: getAbort.signal });
          clearTimeout(getTimer);
          if (getResp.ok) {
            const getTxt = await getResp.text();
            if (getTxt && getTxt.trim() && !getTxt.includes('reached its budget') && !getTxt.includes('<!DOCTYPE')) {
              responseText = getTxt.trim();
              reasoningText = 'Processed through Ollama open stream inference in pure human language.';
              generated = true;
            }
          }
        } catch (_) {}
      }

      // 5. Fallback Intelligence Engine in Pure Human Language (if model timed out or offline)
      if (!responseText) {
        if (attachment && attachment.type === 'image') {
          const imgAns = generateImageHumanAnswer(attachment, text);
          responseText = imgAns.text;
          reasoningText = imgAns.reasoning;
        } else if (attachment && attachment.type === 'video') {
          const vidAns = generateVideoHumanAnswer(attachment, text);
          responseText = vidAns.text;
          reasoningText = vidAns.reasoning;
        } else if (attachment && attachment.type === 'pdf') {
          const pdfAns = generatePdfHumanAnswer(attachment, text);
          responseText = pdfAns.text;
          reasoningText = pdfAns.reasoning;
        } else {
          const fallbackSynth = await synthesizePerplexitySearch(text);
          if (fallbackSynth && fallbackSynth.text) {
            responseText = fallbackSynth.text;
            reasoningText = fallbackSynth.reasoning;
          } else {
            responseText = '### Kai AI Response\n\nI have reviewed your message: **' + text + '**. How would you like me to elaborate or assist you further in pure human language?';
          }
        }
      }

      if (watchdogTimer) clearTimeout(watchdogTimer);

      let bubbleHtml = '';
      if (reasoningText && reasoningText.trim()) {
        bubbleHtml += '<details class="thought-process"><summary>&#129504; View Reasoning Process</summary><div class="reasoning-text">' +
          formatMarkdown(reasoningText.trim()) + '</div></details>';
      }

      const formattedAnswer = formatMarkdown(responseText.trim());
      bubbleHtml += '<div class="ai-content">' + formattedAnswer + '</div>';
      bubbleHtml += '<div class="ai-actions"><button class="action-pill-btn" onclick="copyBubbleText(this)">Copy Answer</button></div>';

      aiBubble.innerHTML = bubbleHtml;

      // Update conversational history (keep last 8 turns)
      const histUserText = text || (attachment ? ('[Attached ' + (attachment.type === 'pdf' ? 'PDF' : (attachment.type === 'video' ? 'Video' : 'Image')) + ': ' + attachment.name + ']') : '');
      chatHistory.push({ role: 'user', content: histUserText });
      chatHistory.push({ role: 'assistant', content: responseText.trim() });
      if (chatHistory.length > 8) {
        chatHistory = chatHistory.slice(chatHistory.length - 8);
      }

    } catch (err) {
      if (watchdogTimer) clearTimeout(watchdogTimer);

      if (err.name === 'AbortError' && !abortCtrl.signal.reason) {
        aiBubble.innerHTML = '<em>Generation stopped.</em>';
      } else {
        try {
          const emergencySynth = await synthesizePerplexitySearch(text);
          if (emergencySynth && emergencySynth.text) {
            aiBubble.innerHTML = '<div class="ai-content">' + formatMarkdown(emergencySynth.text) + '</div>' +
              '<div class="ai-actions"><button class="action-pill-btn" onclick="copyBubbleText(this)">Copy Answer</button></div>';
          } else {
            throw new Error('Emergency synth empty');
          }
        } catch (_) {
          aiBubble.innerHTML =
            '<div class="error-card">' +
              '<span>Connection issue with AI engine. Please verify your internet connection.</span>' +
              '<button class="retry-btn" onclick="retryLastPrompt()">&#128260; Retry</button>' +
            '</div>';
        }
      }
    } finally {
      if (watchdogTimer) clearTimeout(watchdogTimer);
      isGenerating = false;
      sendBtn.classList.remove('stop');
      sendBtn.innerHTML = '<svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>';
      sendBtn.title = 'Send';
      feed.scrollTop = feed.scrollHeight;
    }
  }

  // Globally bind functions invoked by inline HTML attributes
  window.sendQuickPrompt = sendQuickPrompt;
  window.copySnippet = copySnippet;
  window.copyBubbleText = copyBubbleText;
  window.retryLastPrompt = retryLastPrompt;
  window.handleFileSelect = handleFileSelect;
  window.clearAttachment = clearAttachment;
  window.extractPdfText = extractPdfText;
  window.extractVideoKeyframes = extractVideoKeyframes;
  window.formatVideoDuration = formatVideoDuration;
  window.synthesizePerplexitySearch = synthesizePerplexitySearch;
  window.synthesizeNeuralSearch = synthesizeNeuralSearch;

  // Handle URL query parameters (e.g., https://kai.ai/?q=my+prompt)
  function checkUrlQuery() {
    try {
      const params = new URLSearchParams(window.location.search);
      const q = params.get('q') || params.get('prompt');
      if (q && q.trim()) {
        input.value = q.trim();
        handleSend();
      }
    } catch (_) {}
  }
  if (document.readyState === 'loading') {
    window.addEventListener('DOMContentLoaded', checkUrlQuery);
  } else {
    checkUrlQuery();
  }
</script>
