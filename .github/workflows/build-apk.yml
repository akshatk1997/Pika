name: Build & Package Kio APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kio-ci-release-pass -keypass kio-ci-release-pass \
            -dname "CN=Kio Browser, OU=Mobile, O=Kio, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kio-v1.9.0.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kio-v1.9.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kio-v1.9.0.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.9.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kio-v1.9.0.apk)
          NOTES="Kio Browser v1.9.0 (Build 62) — Lightning-fast, privacy-hardened Android browser with Desktop Chrome Extensions & pure on-device NLP narration strictly under 2 MB.\n\n- **Complete Rebrand to Kio & Creative 'K' App Launcher Icon:** Renamed the entire browser to **Kio** with all previous naming removed; crafted a creative geometric **K** launcher icon denoting Kio (adaptive + Material You monochrome) while preserving the homepage emblem 100% untouched.\n- **AI Assistant Removed & Replaced by Desktop Chrome Extensions (Kiwi-Style):** Completely removed the old AI Assistant suite and replaced it across the toolbar, quick menu, and Settings with a full Desktop Chrome Extension engine supporting direct Chrome Web Store URL/ID installation (CRX2/CRX3 binary unpacker), local .crx/.zip/.user.js packages, Manifest V2/V3 content scripts & CSS, static declarative_net_request rules, persistent chrome.storage/runtime/i18n/tabs bridges, interactive extension popups/options, and 1-tap Chrome Web Store auto-detection.\n- **Content Announcer & Reader Mode (Pure On-Device NLP, Zero Data Copy/Save):** Replaced Resources in the 3-dot menu with an on-device NLP Reader & Voice Announcer featuring natural speech normalization, abbreviation-aware sentence segmentation, live sentence highlighting with auto-scroll, speed/prev/next/play-pause controls, and strict volatile RAM-only processing (non-selectable, zero copy, zero disk save, instant RAM wipe on close).\n- **True Edge-to-Edge Full Screen Mode:** Replaced New Tab in the 3-dot menu with Full Screen mode hiding toolbar, status bar, and navigation bar edge-to-edge with zero inset gutters and instant Exit pill / Back support.\n- **Performance & Size Cleanup:** Removed obsolete AI files, Resources sniffer overhead, and 10 unused legacy raster mipmap PNGs; deduplicated early WebView script injections per page load for lightning-fast browsing strictly under 2 MB.\n- **Checks Passed:** :app:testDebugUnitTest (API 26 & 36), :app:lintVitalRelease, and :app:assembleRelease."
          if gh release view v1.9.0 >/dev/null 2>&1; then
            gh release upload v1.9.0 releases/Kio-v1.9.0.apk --clobber
            gh release edit v1.9.0 --title "Kio v1.9.0 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.9.0 releases/Kio-v1.9.0.apk \
              --title "Kio v1.9.0 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
