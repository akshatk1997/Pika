name: Build & Package Bat APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass bat-ci-release-pass -keypass bat-ci-release-pass \
            -dname "CN=Bat Browser, OU=Mobile, O=Bat, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=bat-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=bat-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Bat-v1.1.2.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Bat-v1.1.2.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Bat-v1.1.2.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.1.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Bat-v1.1.2.apk)
          NOTES="Bat Browser v1.1.2 (Build 5) — Minimal, privacy-first Android browser shell powered by Android System WebView.\n\n- **Android 17 & Real-Device Crash Fixes:** Fixed background-thread WebView access in \`shouldInterceptRequest\`, bound WebViews cleanly with \`MutableContextWrapper\` + \`onRelease\` cleanup, eliminated throwaway WebView destruction races, updated \`androidx.graphics:graphics-path:1.1.0\` (16 KB page-size support) & Compose BOM \`2025.12.01\`, preserved R8 \`ViewModel\` / \`WebViewClient\` reflection rules, and guarded clipboard/picker/database calls.\n- **Signed Release APK size:** ${SIZE_BYTES} bytes (strictly < 2 MB / 2,097,152 bytes)\n- **Checks:** \`:app:testDebugUnitTest\` (API 26 & 36, Phone & Tablet), \`:app:lintVitalRelease\`, and \`:app:assembleRelease\` passed."
          if gh release view v1.1.2 >/dev/null 2>&1; then
            gh release upload v1.1.2 releases/Bat-v1.1.2.apk --clobber
            gh release edit v1.1.2 --title "Bat v1.1.2 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.1.2 releases/Bat-v1.1.2.apk \
              --title "Bat v1.1.2 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
