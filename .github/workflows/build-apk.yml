name: Build & Package Kio APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kio-ci-release-pass -keypass kio-ci-release-pass \
            -dname "CN=Kio Browser, OU=Mobile, O=Kio, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kio-v2.0.1.apk
          cat <<EOF > releases/latest.json
          {
            "version": "2.0.1",
            "downloadUrl": "https://github.com/akshatk1997/Pika/releases/download/v2.0.1/Kio-v2.0.1.apk",
            "notes": "Kio Browser v2.0.1 release"
          }
          EOF
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kio-v2.0.1.apk releases/latest.json
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kio-v2.0.1.apk and latest.json (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v2.0.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kio-v2.0.1.apk)
          NOTES="Kio Browser v2.0.1 (Build 73) — Lock Symbol Address Bar & Pull-to-Refresh Gesture (< 2 MB).\n\n- **Collapsible Lock Symbol Address Bar:**\n  - Cleaned upper header bar on webpages into a unified bottom navigation bar.\n  - Center lock icon in toolbar reveals full omnibox (lock badge, copy URL, tracker shield counter, and instant search) on tap and collapses smoothly.\n- **Slide-Down Pull-to-Refresh Gesture:**\n  - Natural pull-down gesture on webpages with floating circular spinning refresh indicator and haptic snap feedback to reload.\n- **Quick Menu Reload Option:**\n  - Direct 1-tap reload in 3-dot quick menu for effortless one-handed control.\n- **Full Power-User & Privacy Suite Retained:**\n  - Retains Soul Browser Media Sniffer, Image Sniffer, Full-Page Scroll Screenshot, Screen Filter, Clean Mode, and instant cache navigation.\n- **Strict Constraint:** Release APK strictly under 2 MB (2,097,152 bytes)."
          if gh release view v2.0.1 >/dev/null 2>&1; then
            gh release upload v2.0.1 releases/Kio-v2.0.1.apk --clobber
            gh release edit v2.0.1 --title "Kio v2.0.1 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v2.0.1 releases/Kio-v2.0.1.apk \
              --title "Kio v2.0.1 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
