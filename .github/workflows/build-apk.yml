name: Build & Package Kio APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kio-ci-release-pass -keypass kio-ci-release-pass \
            -dname "CN=Kio Browser, OU=Mobile, O=Kio, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kio-v2.0.0.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kio-v2.0.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kio-v2.0.0.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v2.0.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kio-v2.0.0.apk)
          NOTES="Kio Browser v2.0.0 (Build 72) — Full Soul Browser Power-User Suite (< 2 MB).\n\n- **Media & Video Downloader / Sniffer (Soul Browser Style):**\n  - Real-time video and audio stream sniffer detecting MP4, WEBM, M3U8/HLS, and audio resources from network requests and HTML5 media elements.\n  - Dedicated 3-dot menu Media tile with live detected badge count.\n  - 1-tap direct stream download, external player launch (VLC/MX Player), and link copying.\n- **Save All Images / Image Sniffer (Soul Browser Image Box):**\n  - 1-tap scraper extracting all images (img tags, srcset, picture elements, CSS background-images).\n  - Image gallery dialog with selection controls and batch download into Pictures.\n- **Full Page Scroll Screenshot (Scroll Capture):**\n  - High-resolution full-document screenshot capture saving the entire scrolling page to Pictures/Kio and Android Gallery.\n- **Screen Filter (Night Dimmer & Blue Light Eye Care):**\n  - Built-in eye protection overlay with Warm Amber and OLED Night Dimmer modes and customizable 10%-80% opacity slider, allowing seamless touch pass-through.\n- **Clean Mode (Distraction-Free Browsing):**\n  - 1-tap clutter remover automatically hiding cookie consent walls, newsletter overlays, sticky banner ads, and floating promo bars.\n- **Go Back Without Refresh:**\n  - Instant cache-first history navigation eliminating page reloads and white flashes.\n- **Strict Constraint:** Release APK strictly under 2 MB (2,097,152 bytes)."
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 releases/Kio-v2.0.0.apk --clobber
            if [ -f "releases/Kio-Desktop-v2.0.0-windows-x64.zip" ]; then
              gh release upload v2.0.0 releases/Kio-Desktop-v2.0.0-windows-x64.zip --clobber
            fi
            gh release edit v2.0.0 --title "Kio v2.0.0 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            ASSETS="releases/Kio-v2.0.0.apk"
            if [ -f "releases/Kio-Desktop-v2.0.0-windows-x64.zip" ]; then
              ASSETS="$ASSETS releases/Kio-Desktop-v2.0.0-windows-x64.zip"
            fi
            gh release create v2.0.0 $ASSETS \
              --title "Kio v2.0.0 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
