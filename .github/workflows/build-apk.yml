name: Build & Package Kio APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kio-ci-release-pass -keypass kio-ci-release-pass \
            -dname "CN=Kio Browser, OU=Mobile, O=Kio, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kio-v1.9.5.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kio-v1.9.5.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kio-v1.9.5.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.9.5
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kio-v1.9.5.apk)
          NOTES="Kio Browser v1.9.5 (Build 67) — Full Chrome Extension Background Service Worker Runtime, Real Async RPC/Port Messaging, CORS-Free Privileged Fetch/XHR, and Native WebView Proxy Routing strictly under 2 MB.\n\n- **Fixed Infinite Loading Spinner in Extension Popups (Urban VPN, Dark Reader, uBlock Lite, Stylus & More):**\n  - Added **ExtensionRuntimeHost** booting MV3 \`background.service_worker\` (classic & ES module) and MV2 \`background.scripts\` / \`background.page\` in a lazy headless Background Runtime Host before extension popups open.\n  - Built a true bidirectional **Popup ↔ Background ↔ Content Script IPC router** with async \`chrome.runtime.sendMessage\` + \`sendResponse\` callbacks/Promises and full-duplex \`chrome.runtime.connect\` / \`chrome.runtime.onConnect\` Ports.\n  - Added a **CORS-free privileged \`fetch()\` & \`XMLHttpRequest\` (Axios) bridge** for extension background and popup contexts so extensions can communicate cleanly with their API servers without WebView CORS failures.\n  - Integrated native **\`chrome.proxy\` routing** via AndroidX WebKit \`ProxyController\` (supporting both \`fixed_servers\` and \`pac_script\`) plus **\`chrome.webRequest.onAuthRequired\`** wired to \`onReceivedHttpAuthRequest\` so proxy/VPN extensions actually connect and authenticate in Standard Mode (and auto-suspend in Private Mode for zero-leak isolation).\n  - Added missing startup APIs (\`chrome.privacy.network.webRTCIPHandlingPolicy\`, real timer-backed \`chrome.alarms\`, \`chrome.offscreen\`, \`chrome.management\`, \`chrome.declarativeNetRequest\`, Service Worker \`importScripts\`/\`clients\`/\`skipWaiting\`) and improved responsive Popup sizing + Refresh button.\n- **Checks Passed:** :app:testDebugUnitTest (API 26 & 36), :app:lintVitalRelease, and :app:assembleRelease."
          if gh release view v1.9.5 >/dev/null 2>&1; then
            gh release upload v1.9.5 releases/Kio-v1.9.5.apk --clobber
            gh release edit v1.9.5 --title "Kio v1.9.5 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.9.5 releases/Kio-v1.9.5.apk \
              --title "Kio v1.9.5 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
