name: Build & Package Kai APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kai-ci-release-pass -keypass kai-ci-release-pass \
            -dname "CN=Kai Browser, OU=Mobile, O=Kai, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kai-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kai-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kai-v1.4.9.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kai-v1.4.9.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kai-v1.4.9.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.4.9
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kai-v1.4.9.apk)
          NOTES="Kai Browser v1.4.9 (Build 22) — Minimal, privacy-first Android browser shell powered by Android System WebView.\n\n- **Clean, Organised Standard Homepage:** Default mode on launch is clean Standard Search without visual clutter, providing instant, hitch-free navigation.\n- **Zero-Lag Fluid Scrolling:** Eliminated nested scroll conflicts on the homepage by rendering bookmarks in smooth non-lazy grid rows, removing touch event freezes and stutter.\n- **Luxurious Kai AI Entering Animation:** Tapping the Kai AI tab triggers a smooth, aesthetic portal transition with radiant concentric aura scaling before seamlessly entering the AI workspace.\n- **Restored Cosmic Midnight Kai AI Background:** Restored signature deep cosmic dark palette (#070B14, #0E1626, #00F2FE) while preserving high-legibility ChatGPT fonts (Söhne & Söhne Mono).\n- **Frontier Multimodal Vision & Keyframes:** Gemini 3.5 Flash Lite with high-resolution image analysis, sequential video keyframe comprehension, and real-time voice dictation.\n- **Strictly Under 2 MB Footprint:** Signed release APK is ${SIZE_BYTES} bytes (< 2 MB / 2,097,152 bytes limit).\n- **Checks Passed:** \`:app:testDebugUnitTest\` (API 26 & 36), \`:app:lintVitalRelease\`, and \`:app:assembleRelease\`."
          if gh release view v1.4.9 >/dev/null 2>&1; then
            gh release upload v1.4.9 releases/Kai-v1.4.9.apk --clobber
            gh release edit v1.4.9 --title "Kai v1.4.9 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.4.9 releases/Kai-v1.4.9.apk \
              --title "Kai v1.4.9 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
