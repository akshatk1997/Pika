name: Build & Package Kio APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kio-ci-release-pass -keypass kio-ci-release-pass \
            -dname "CN=Kio Browser, OU=Mobile, O=Kio, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kio-v1.9.1.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kio-v1.9.1.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kio-v1.9.1.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.9.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kio-v1.9.1.apk)
          NOTES="Kio Browser v1.9.1 (Build 63) — Zero-Leak Bidirectional Standard ↔ Private Isolation, Exclusive Private-Mode Safety Tools, Full Dark & Light Mode, and Leaner APK strictly under 2 MB.\n\n- **Zero-Leak Bidirectional Isolation (Standard ↔ Private):** Strict mode-boundary cookie vaulting & incineration on every switch between Standard and Private tabs, ephemeral RAM-only \`localStorage\`/\`sessionStorage\` proxy in Private tabs, disabled IndexedDB/CacheStorage/third-party cookies/geolocation/disk caching/extensions/favicons/external app launches/clipboard leak guards in Private Mode — zero data shared from Standard → Private or Private → Standard/outside.\n- **Bookmarks Exclusively for Standard Mode:** Completely removed Bookmarks UI, homepage Bookmarks section, Bookmark actions, and Bookmarks Backup from Private Mode (replaced on the Private homepage by the **Zero-Leak Private Vault** card).\n- **Private-Mode-Only Safety Tools (3-Dot Menu):** Removed **Open externally**, **Add shortcut**, **Share**, **Bookmarks**, **History**, and **Extensions** inside Private Mode and introduced 5 exclusive Private-Only safety tools visible ONLY in Private Mode: **Burn session** (instant 1-tap incineration of all private tabs, cookies, RAM & clipboard), **New identity** (rotate session fingerprint & clear cookies/RAM on reload), **Shield audit** (live isolation verification status dialog), **Wipe clipboard**, and **Purge RAM**.\n- **Full Dark Mode & Light Mode Across the Entire Browser:** Tapping Dark Mode or Light Mode seamlessly switches the entire browser — including the Homepage (with preserved KioLogo), search header, Android status & navigation bar icons, menus, settings, and web pages.\n- **Safe Space Cleanup:** Removed unused template color/locale resources, placeholder unit test, and unused Compose tooling preview dependencies without compromising any browser feature or performance — strictly under 2 MB.\n- **Checks Passed:** :app:testDebugUnitTest (API 26 & 36), :app:lintVitalRelease, and :app:assembleRelease."
          if gh release view v1.9.1 >/dev/null 2>&1; then
            gh release upload v1.9.1 releases/Kio-v1.9.1.apk --clobber
            gh release edit v1.9.1 --title "Kio v1.9.1 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.9.1 releases/Kio-v1.9.1.apk \
              --title "Kio v1.9.1 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
