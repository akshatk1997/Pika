name: Build & Package Kio APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kio-ci-release-pass -keypass kio-ci-release-pass \
            -dname "CN=Kio Browser, OU=Mobile, O=Kio, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kio-v1.9.8.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kio-v1.9.8.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kio-v1.9.8.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.9.8
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kio-v1.9.8.apk)
          NOTES="Kio Browser v1.9.8 (Build 70) — Complete Kiwi-Style Chrome Extension Architecture & Runtime Parity (< 2 MB).\n\n- **Kiwi-Style Extension Access in 3-Dot Menu:**\n  - Added dedicated 'Extensions' tile in the 3-dot menu grid for standard browsing.\n  - Added Kiwi-style 'EXTENSIONS' section at the bottom of the 3-dot menu listing all enabled extensions with icons and titles.\n  - Tapping an extension immediately launches its popup dialog directly over the active webpage, or dispatches chrome.action.onClicked for background-only extensions.\n- **Single-Source RPC Message Routing & Port Fixes:**\n  - Resolved premature null reply race condition by separating popup->background RPC routing (routeRuntimeMessage) from tab content script messaging (routeTabMessage).\n  - chrome.tabs.sendMessage and chrome.tabs.connect route directly to the active web tab content script.\n- **Content Script Stage='all' Injection:**\n  - Guaranteed reliable injection for extensions specifying run_at: document_start (e.g. Dark Reader) alongside document_end/idle scripts with per-extension single-run idempotency guards.\n- **Root-Relative Asset Resolution & Decompression:**\n  - Support root-relative asset URLs (/static/..., /assets/...) in virtual extension resource loader via HTTP Referer header parsing and activePopupExtId tracking.\n  - Transparent GZIP stream decompression in privileged fetch.\n- **Strict Constraint:** Release APK strictly under 2 MB (2,097,152 bytes)."
          if gh release view v1.9.8 >/dev/null 2>&1; then
            gh release upload v1.9.8 releases/Kio-v1.9.8.apk --clobber
            gh release edit v1.9.8 --title "Kio v1.9.8 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.9.8 releases/Kio-v1.9.8.apk \
              --title "Kio v1.9.8 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
