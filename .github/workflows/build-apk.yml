name: Build & Package Kio APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kio-ci-release-pass -keypass kio-ci-release-pass \
            -dname "CN=Kio Browser, OU=Mobile, O=Kio, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kio-v1.9.6.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kio-v1.9.6.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kio-v1.9.6.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.9.6
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kio-v1.9.6.apk)
          NOTES="Kio Browser v1.9.6 (Build 68) — 3-Dot Menu Overhaul (Modes tile, Block Images, Clean Header), Enhanced Settings Sections with Feature Details, Kio Launcher Icon in About, and Professional UI Wording (< 2 MB).\n\n- **Refined 3-Dot Quick Menu:**\n  - Removed cluttered header chips (Extensions, Desktop, iPhone, System, Data Saver), leaving a clean theme toggle.\n  - Replaced the bookmark grid action with a dedicated **Modes** tile that reveals tappable **Desktop**, **iPhone**, and **Mobile** options with real-time active mode highlighting.\n  - Replaced the Extensions grid tile with a direct **Block Images** toggle with instant toast feedback.\n- **Enhanced Settings Experience:**\n  - Added rich feature details across all settings categories (MV3 extensions, search & homepage, text zoom & dark web, tracker shield & HTTPS enforcement, bandwidth optimizer, background playback, session restore, and HTML bookmark manager).\n  - Added the official vector **Kio launcher icon** inside the **About Kio** section and main Settings header card.\n- **Professional UI Refinements:**\n  - Streamlined toasts, status labels, and banners for both Standard and Private Browsing modes.\n- **Checks Passed:** :app:testDebugUnitTest (API 26 & 36), :app:lintVitalRelease, and :app:assembleRelease strictly under 2 MB."
          if gh release view v1.9.6 >/dev/null 2>&1; then
            gh release upload v1.9.6 releases/Kio-v1.9.6.apk --clobber
            gh release edit v1.9.6 --title "Kio v1.9.6 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.9.6 releases/Kio-v1.9.6.apk \
              --title "Kio v1.9.6 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
