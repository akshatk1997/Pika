name: Build & Package Kio APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kio-ci-release-pass -keypass kio-ci-release-pass \
            -dname "CN=Kio Browser, OU=Mobile, O=Kio, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kio-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kio-v1.9.2.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kio-v1.9.2.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kio-v1.9.2.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.9.2
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kio-v1.9.2.apk)
          NOTES="Kio Browser v1.9.2 (Build 64) — Hidden-K Concentric App Icon, Kiwi-Style Direct Chrome Web Store Extensions Fix, and Ultra-Low Data & Storage Performance Engine strictly under 2 MB.\n\n- **Creative Hidden-'K' Concentric App Launcher Icon (Homepage Emblem 100% Untouched):** Rebuilt the adaptive & monochrome app launcher icon from scratch directly on the classic concentric orbital logo using the exact same cyan/sky/indigo/white color palette, concealing a subtle geometric **K** inside the inner orbital meridian chord and prism refraction rays through the center nucleus while keeping the homepage \`KioLogo\` completely untouched.\n- **Chrome Web Store & Desktop Extensions Fix (Kiwi-Style Direct Install & Full MV2/MV3 Engine):**\n  - Fixed Chrome Web Store's *\"Item currently unavailable\"* & disabled *\"Add to Chrome\"* button by auto-enforcing Desktop Windows Chrome UA + Client Hints, spoofing \`navigator.userAgentData\`, clearing the false WebView error banner, and activating the Store's own install button directly to Kio's CRX3 installer.\n  - Upgraded Google CRX3 downloads with full desktop platform query parameters (\`os=win&arch=x64&prod=chromecrx\`) + resilient fallback endpoints and strict HTTP 204 rejection.\n  - Raised CRX/ZIP unpacker limit from 600 to 4,000 files (64 MB cap with Zip-Slip protection) so large real-world desktop Chrome extensions unpack cleanly.\n  - Injected the full MV2/MV3 \`chrome.*\` / \`browser.*\` / \`GM_*\` API prelude synchronously into extension HTML \`<head>\` before scripts execute, added \`chrome-extension://\` virtual serving, and wired real-time Popup ↔ Active Tab messaging, live \`chrome.storage.onChanged\` broadcasts, \`chrome.scripting.executeScript\` / \`insertCSS\`, and \`chrome.tabs.reload\`.\n- **Low-Data Surfing & Ultra-Lean Android Footprint:**\n  - Always-on prefetch/prerender elimination and native below-the-fold lazy loading + async image decoding cut mobile data usage and speed up page loads without degrading visual quality.\n  - Added automatic WebP favicon disk compression, 96-icon/14-day disk cache trimming, orphan cache cleanup, and \`onTrimMemory\` background WebView eviction so Kio takes minimal Android space & RAM while staying lightning-fast strictly under 2 MB.\n- **Checks Passed:** :app:testDebugUnitTest (API 26 & 36), :app:lintVitalRelease, and :app:assembleRelease."
          if gh release view v1.9.2 >/dev/null 2>&1; then
            gh release upload v1.9.2 releases/Kio-v1.9.2.apk --clobber
            gh release edit v1.9.2 --title "Kio v1.9.2 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.9.2 releases/Kio-v1.9.2.apk \
              --title "Kio v1.9.2 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
