name: Build & Package Kai APK (< 2 MB)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Accept Android SDK licenses
        run: |
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          yes | "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true

      - name: Set up Gradle 9.3.1
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Generate ephemeral signing keystores for CI release
        run: |
          keytool -genkeypair -v -keystore "${{ runner.temp }}/release.jks" \
            -storetype PKCS12 -alias upload -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass kai-ci-release-pass -keypass kai-ci-release-pass \
            -dname "CN=Kai Browser, OU=Mobile, O=Kai, L=Unknown, S=Unknown, C=US"
          keytool -genkeypair -v -keystore debug.keystore \
            -storetype PKCS12 -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass android -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"
          echo "KEYSTORE_PATH=${{ runner.temp }}/release.jks" >> "$GITHUB_ENV"
          echo "STORE_PASSWORD=kai-ci-release-pass" >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=kai-ci-release-pass" >> "$GITHUB_ENV"

      - name: Run unit & Robolectric tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Run Release Vital Lint
        run: gradle :app:lintVitalRelease --no-daemon

      - name: Build R8-minified Release APK
        run: gradle :app:assembleRelease --no-daemon

      - name: Verify APK size is strictly under 2 MB
        run: |
          APK_PATH="app/build/outputs/apk/release/app-release.apk"
          SIZE_BYTES=$(stat -c%s "$APK_PATH")
          MAX_BYTES=2097152
          echo "Release APK size: $SIZE_BYTES bytes (limit: $MAX_BYTES bytes)"
          if [ "$SIZE_BYTES" -ge "$MAX_BYTES" ]; then
            echo "ERROR: APK size ($SIZE_BYTES bytes) exceeds 2 MB limit!"
            exit 1
          fi
          mkdir -p releases
          cp "$APK_PATH" releases/Kai-v1.8.0.apk
          rm -f debug.keystore

      - name: Commit APK into repository
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add releases/Kai-v1.8.0.apk
          if ! git diff --cached --quiet; then
            git commit -m "Add signed release APK Kai-v1.8.0.apk (< 2 MB) [skip ci]"
            git push origin HEAD:main
          else
            echo "APK unchanged, skipping commit."
          fi

      - name: Create or update GitHub Release v1.8.0
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SIZE_BYTES=$(stat -c%s releases/Kai-v1.8.0.apk)
          NOTES="Kai Browser v1.8.0 (Build 53) — Minimal, privacy-hardened Android browser shell powered by Android System WebView.\n\n- **TSyndicate Pop-Under Ad Network Lockout & Streaming Video SSL Fix:** Defeated aggressive video streaming pop-under ad network hijacking (tsyndicate.com / syndication networks); blocked over 30 video ad and pop-under redirect domains; prevented SSL protocol errors (net::ERR_SSL_PROTOCOL_ERROR) from displaying destructive error overlays over video playback; in-page DOM script neutralization of window.open ad spawns and transparent <a> clickjack links with automatic playback continuation.\n- **Universal Video Playback Fix & Security Hardening:** Restored smooth video playback across all websites by enabling mixed-content passive media compatibility (MIXED_CONTENT_COMPATIBILITY_MODE), database/IndexedDB storage for adaptive players (HLS.js, Dash.js, Shaka player), authentic Chrome Mobile user-agent without WebView version tags, and transparent 1x1 video poster / centered progress handling.\n- **Protected Media & DRM Auto-Grant:** Auto-grants Encrypted Media Extensions (EME / Widevine DRM via RESOURCE_PROTECTED_MEDIA_ID) on HTTPS origins, allowing encrypted streams on Twitter/X, Reddit, Vimeo, Spotify, and streaming sites to play seamlessly without dialog interruptions or player freezes while preserving explicit consent for camera/mic capture.\n- **Universal HTML5 Video Compatibility Engine:** Auto-injects playsinline attributes, catches unhandled play() Promise rejections with muted fallback, dynamically observes player mounting, and neutralizes transparent clickjack / popup overlays on streaming sites.\n- **Ad Blocker VAST XML Compatibility:** Serves valid empty VAST XML (<VAST version=\\\"3.0\\\"/>) for blocked video ad endpoints so HTML5 players transition immediately to the content video without XML parser crashes.\n- **Under 2 MB Limit:** Built with aggressive R8 minification, resource shrinking, and bytecode optimization, strictly maintaining the < 2 MB binary limit.\n- **Checks Passed:** :app:testDebugUnitTest (API 26 & 36), :app:lintVitalRelease, and :app:assembleRelease."
          if gh release view v1.8.0 >/dev/null 2>&1; then
            gh release upload v1.8.0 releases/Kai-v1.8.0.apk --clobber
            gh release edit v1.8.0 --title "Kai v1.8.0 (< 2 MB)" --notes "$(printf "$NOTES")"
          else
            gh release create v1.8.0 releases/Kai-v1.8.0.apk \
              --title "Kai v1.8.0 (< 2 MB)" \
              --notes "$(printf "$NOTES")"
          fi
