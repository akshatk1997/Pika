name: Build & Package Kio Desktop PC (< 2 MB)

on:
  push:
    branches: [ main ]
    paths:
      - 'desktop/**'
      - '.github/workflows/build-desktop.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Kio Desktop using build.ps1
        run: |
          powershell -ExecutionPolicy Bypass -File desktop/build.ps1

      - name: Verify Desktop bundle size (< 2 MB)
        run: |
          $zipPath = "releases/Kio-Desktop-v2.0.0-windows-x64.zip"
          if (-not (Test-Path $zipPath)) { throw "ZIP distribution not found!" }
          $size = (Get-Item $zipPath).Length
          $maxBytes = 2097152
          Write-Host "Desktop package size: $size bytes (limit: $maxBytes bytes)"
          if ($size -ge $maxBytes) {
            throw "ERROR: Desktop package size ($size bytes) exceeds 2 MB limit!"
          }

      - name: Upload Desktop Artifact to Release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          if gh release view v2.0.0 >/dev/null 2>&1; then
            gh release upload v2.0.0 releases/Kio-Desktop-v2.0.0-windows-x64.zip --clobber
          fi
